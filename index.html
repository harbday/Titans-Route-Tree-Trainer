<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2340">
<title>Titans Playbook</title>
<meta name="apple-mobile-web-app-title" content="Titans Playbook">
<meta name="application-name" content="Titans Playbook">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0c2340; --navy2:#071a30; --tblue:#4b92db; --tblue-dark:#2f6fb5;
    --red:#c8102e; --red-dark:#8e0a20; --silver:#a5acaf; --silver-dark:#6f7578; --white:#ffffff;
    --grass:#2f9e4f; --grass2:#2a8f47; --good:#2fbf71; --good-dark:#1d8a4f;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--navy);overflow:hidden;position:fixed;inset:0}
  body{font-family:"Oswald","Arial Narrow",Impact,system-ui,sans-serif;color:var(--white);height:100dvh;width:100vw;--z:1}
  /* #app is laid out at a phone-like logical size and scaled up to fill tablets and desktops */
  #app{position:absolute;top:0;left:0;width:calc(100vw / var(--z));height:calc(100dvh / var(--z));transform:scale(var(--z));transform-origin:0 0;display:flex;flex-direction:column;overflow:hidden;
       padding-top:calc((var(--safe-top) + 6px) / var(--z));padding-bottom:calc(var(--safe-bot) / var(--z));
       background:linear-gradient(180deg,#123059 0%,#0c2340 45%,#071a30 100%)}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1 1 auto;overflow:hidden}
  .brand .t{min-width:0;overflow:hidden}
  .brand .t b,.brand .t span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  @media (max-width:520px){
    header{padding:8px 10px 4px;gap:6px}
    .brand{gap:8px} .brand img{height:38px} .brand .t b{font-size:18px} .brand .t span{font-size:10px;letter-spacing:1.5px}
    .scorebox{gap:5px} .pill{padding:2px 9px;font-size:14px} .pill.home{padding:2px 8px} .pill.player{max-width:96px}
    .sil{width:18px;height:18px;margin-right:4px}
  }
  .brand img{height:44px;width:auto;display:none}
  .brand img.loaded{display:block}
  .brand .t{line-height:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .brand .t b{display:block;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .brand .t span{display:block;font-size:12px;color:var(--tblue);letter-spacing:2px;text-transform:uppercase}
  .scorebox{display:flex;gap:6px;align-items:center;flex-shrink:0}
  .pill{background:rgba(255,255,255,.08);border:2px solid rgba(165,172,175,.45);border-radius:999px;padding:3px 12px;font-size:16px;font-weight:700;white-space:nowrap}
  .pill.red{background:var(--red);border-color:var(--red-dark)}
  .pill.home{appearance:none;font:inherit;cursor:pointer;padding:3px 10px}
  .sil{width:22px;height:22px;vertical-align:-5px;margin-right:6px} .sil.big{width:40px;height:40px;margin:0}
  .pill.player{display:inline-flex;align-items:center;appearance:none;font:inherit;color:#fff;background:var(--tblue);border-color:var(--tblue-dark);cursor:pointer;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 12px}
  #panel{overflow:auto;-webkit-overflow-scrolling:touch}
  body.book .fieldwrap{display:none} body.book #panel{flex:1}
  .fieldwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #field{border-radius:18px;box-shadow:0 8px 0 var(--navy2),0 12px 30px rgba(0,0,0,.5);background:var(--grass);max-width:100%;max-height:100%;touch-action:manipulation}
  .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .prompt{text-align:center;font-size:17px;min-height:24px;margin:8px 0 4px;color:var(--silver);line-height:1.2}
  .prompt .big{display:block;font-size:30px;color:var(--white);line-height:1.05;letter-spacing:.5px;text-transform:uppercase}
  .levels{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}
  .lvl{appearance:none;border:2px solid rgba(165,172,175,.4);background:rgba(255,255,255,.06);color:var(--silver);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.5px}
  .lvl.on{background:var(--tblue);border-color:var(--tblue-dark);color:#fff}
  .lvl.locked{opacity:.5}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 0 10px}
  .btn{appearance:none;border:0;border-radius:14px;padding:15px 8px;font:inherit;font-size:24px;font-weight:700;letter-spacing:.5px;color:#fff;
       background:var(--tblue);box-shadow:0 6px 0 var(--tblue-dark);cursor:pointer;transition:transform .08s;line-height:1.05}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tblue-dark)}
  .btn.red{background:var(--red);box-shadow:0 6px 0 var(--red-dark)}
  .btn.good{background:var(--good);box-shadow:0 6px 0 var(--good-dark)}
  .btn.bad{background:var(--red);box-shadow:0 6px 0 var(--red-dark)}
  .btn.dim{opacity:.4}
  .btn .mini{display:block;width:100%;height:78px}
  .btn.pic{padding:8px}
  nav{display:flex;gap:6px;padding:8px 12px 10px;background:rgba(0,0,0,.35);border-top:3px solid var(--red)}
  nav button{flex:1;appearance:none;border:2px solid rgba(165,172,175,.3);border-radius:12px;padding:8px 0;font:inherit;font-size:12px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
             background:rgba(255,255,255,.06);color:var(--silver)}
  nav button.on{background:var(--tblue);color:#fff;border-color:var(--tblue-dark);box-shadow:0 4px 0 var(--tblue-dark)}
  nav button span{display:block;font-size:19px}
  nav button.plays{border-color:var(--red)} nav button.plays.on{background:var(--red);border-color:var(--red-dark);box-shadow:0 4px 0 var(--red-dark)}
  .learnlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 0 10px}
  .learnlist .btn{padding:10px 4px;font-size:18px;background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.35);border:2px solid rgba(165,172,175,.35)}
  .learnlist .btn .num{display:block;font-size:26px;color:var(--tblue);line-height:1}
  .learnlist .btn.on{background:var(--red);border-color:var(--red-dark);box-shadow:0 5px 0 var(--red-dark)}
  .learnlist .btn.on .num{color:#fff}
  .sidetoggle{display:flex;justify-content:center;gap:6px;padding:4px 0 10px}
  .banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
  .banner div{font-size:60px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:2px;text-shadow:0 5px 0 var(--navy2),0 8px 20px rgba(0,0,0,.5);transform:rotate(-5deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2) rotate(-5deg);opacity:0}to{transform:scale(1) rotate(-5deg);opacity:1}}
  .medal{position:absolute;inset:0;background:rgba(12,35,64,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;border-radius:18px;padding:20px}
  .medal .trophy{font-size:90px}
  .medal h2{margin:6px 0;font-size:32px;text-transform:uppercase;letter-spacing:1px}
  .medal p{margin:2px 0 14px;font-size:18px;color:var(--silver)}
  .medal .unlock{color:var(--tblue);font-size:20px;margin-bottom:12px}

  .screen{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(75,146,219,.55), transparent 60%),

  .screen::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .screen > *{position:relative;z-index:1}
  .splash .logo{display:block;margin:0 auto;width:min(90%,520px);max-height:30%;object-fit:contain;filter:drop-shadow(0 18px 30px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(75,146,219,.35))}
  .splash .coach{margin:0 0 6px;font-size:34px;font-weight:700;text-transform:uppercase;letter-spacing:3px;text-shadow:0 3px 0 var(--navy2),0 8px 20px rgba(0,0,0,.5)}
  .splash .wordmark{display:block;margin:22px auto 0;width:min(80%,420px);filter:drop-shadow(0 8px 18px rgba(0,0,0,.6))}
  .splash .season{margin:18px 0 0;color:var(--tblue);font-size:20px;letter-spacing:5px;text-transform:uppercase;font-weight:500}
  .splash .credit{position:absolute;bottom:14px;left:0;right:0;font-size:11px;color:rgba(165,172,175,.6);letter-spacing:.5px;margin:0}
  .splash .btn{font-size:26px;padding:16px 44px;letter-spacing:2px;text-transform:uppercase;margin-top:44px}
  .picker{justify-content:flex-start;padding-top:max(34px,var(--safe-top));overflow:auto}
  .picker img{height:80px;margin-bottom:6px}
  .picker h2{margin:6px 0 2px;font-size:36px;text-transform:uppercase;letter-spacing:2px}
  .picker p{margin:0 0 18px;color:var(--silver);font-size:17px}
  .roster{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92%,520px)}
  .roster .btn{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;font-size:24px;background:rgba(255,255,255,.08);border:2px solid rgba(165,172,175,.35);box-shadow:0 6px 0 rgba(0,0,0,.4)}
  .roster .btn:active{box-shadow:0 2px 0 rgba(0,0,0,.4)}
  .roster .jersey{width:54px;height:54px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(75,146,219,.35),rgba(12,35,64,.9));border:2px solid var(--tblue);box-shadow:inset 0 1px 0 rgba(255,255,255,.25);flex-shrink:0}
  .roster .btn small{display:block;font-size:13px;color:var(--silver);font-weight:500;letter-spacing:.5px}
  .hub img{height:90px;margin-bottom:10px}
  .hub h2{margin:0 0 18px;font-size:32px;text-transform:uppercase;letter-spacing:2px}
  .hubcards{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:min(92%,560px)}
  .hubcard{appearance:none;border:2px solid rgba(165,172,175,.35);border-radius:18px;padding:22px 12px;background:rgba(255,255,255,.08);color:#fff;font:inherit;box-shadow:0 8px 0 rgba(0,0,0,.45);cursor:pointer}
  .hubcard:active{transform:translateY(5px);box-shadow:0 3px 0 rgba(0,0,0,.45)}
  .hubcard .ico{display:block;font-size:54px;line-height:1;margin-bottom:8px;height:54px}
  .treeico,.playico{width:54px;height:54px;display:block;margin:0 auto} .treeico.nav,.playico.nav{width:22px;height:22px;margin:0 auto 1px}
  .hubcard b{display:block;font-size:26px;text-transform:uppercase;letter-spacing:1px}
  .hubcard small{display:block;font-size:14px;color:var(--silver);margin-top:4px}
  .hubcard.red{background:rgba(200,16,46,.35);border-color:var(--red)}
  .hub .cancel,.picker .cancel{margin-top:18px;background:transparent;border:2px solid rgba(165,172,175,.35);color:var(--silver);border-radius:999px;padding:8px 18px;font:inherit;font-size:15px}
  /* phones: compact header so the chips never overlap the brand */
  @media (max-width:520px){
    .brand .t b{font-size:18px} .brand .t span{font-size:10px;letter-spacing:1.5px}
    .brand img{height:36px}
    .pill{font-size:13px;padding:3px 8px} .pill.home{padding:3px 7px}
    .pill.player{max-width:88px} .sil{width:18px;height:18px;margin-right:4px}
    header{padding:8px 10px 4px;gap:6px}
  }
  @media (max-width:380px){ .brand .t{display:none} }
  /* wide screens (landscape tablets, phones on their side, desktops): field left, controls right */
  @media (orientation:landscape) and (min-width:700px){
    main{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);column-gap:18px;align-items:stretch}
    .fieldwrap{grid-row:1/3;grid-column:1}
    .prompt{grid-column:2;grid-row:1;margin-top:10px}
    #panel{grid-column:2;grid-row:2;min-height:0;overflow:auto}
    body.book main{display:flex}
  }
  /* short landscape phones: shrink chrome so the field keeps room */
  @media (max-height:520px){ nav button span{display:none} nav button{padding:6px 0} .prompt .big{font-size:22px} .btn{padding:10px 8px;font-size:18px} }
  @media (prefers-reduced-motion:reduce){.banner div{animation:none}}

  .posgrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;padding:6px 5px 14px}
  .posgrid .btn{font-size:30px;padding:14px 0;border:3px solid rgba(255,255,255,.7)}
  .posgrid .btn.cur{border-color:#ffd23f;outline:3px solid #ffd23f;outline-offset:2px}
  .playnav{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding:2px 0 8px}
  .playnav .btn{font-size:17px;padding:11px 4px}
  .btn.ghost{background:rgba(255,255,255,.1);box-shadow:0 6px 0 rgba(0,0,0,.4);border:2px solid rgba(165,172,175,.35)}
  .playlist{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:0 0 10px}
  .playlist .lvl{text-align:left;font-size:13px;padding:6px 10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lvl.pos{font-size:16px;padding:3px 12px}
  .prompt b{font-weight:700}
  .bookgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 0 14px}
  .bookcard{appearance:none;border:2px solid rgba(165,172,175,.35);border-radius:14px;padding:0;background:rgba(255,255,255,.06);color:#fff;font:inherit;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.4);cursor:pointer;text-align:left}
  .bookcard .hd{display:flex;align-items:center;gap:8px;padding:6px 10px;font-size:15px;font-weight:700;background:rgba(0,0,0,.3)}
  .bookcard .hd .n{background:var(--red);border-radius:6px;padding:0 7px;font-size:15px}
  .bookcard svg{display:block;width:100%;height:auto;background:#eef2f4}
  .poschip{display:flex;justify-content:center;gap:8px;align-items:center;padding:0 0 8px;color:var(--silver);font-size:14px}
  .posbadge{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;border:2.5px solid #fff;color:#fff;font-size:15px;font-weight:700;box-shadow:0 2px 4px rgba(0,0,0,.4)}
  .answers .btn.small{font-size:17px;padding:13px 6px}
</style>

/* ---------- Field ---------- */
const FONT = '"Oswald","Arial Narrow",Impact,sans-serif';
let Z=1; // current app scale
function fitApp(){
  const vw=document.documentElement.clientWidth, vh=document.documentElement.clientHeight;
  // phone-sized logical layout (430 x 860) scaled up until it fills the shorter dimension; never below 1
  let z=Math.min(vw/430, vh/860); z=Math.max(1, Math.min(z, 2.6));
  Z=z; document.body.style.setProperty('--z', z);
}
const cv = document.getElementById('field'), ctx = cv.getContext('2d');
const fw = document.querySelector('.fieldwrap');
let W=300,H=400, dpr=window.devicePixelRatio||1;
const VIEW_ROUTES={w:30,h:24,y0:-2.5}, VIEW_PLAYS={w:36,h:21,y0:-7.5}; let view=VIEW_ROUTES; let YARDS_W=30, YARDS_H=24;
function sizeCanvas(){
  YARDS_W=view.w; YARDS_H=view.h;
  const rect = fw.getBoundingClientRect(); if(rect.height<40) return;
  const rw=rect.width/Z, rh=rect.height/Z;   // logical (pre-scale) size
  let h = rh, w = h*(YARDS_W/YARDS_H);
  if (w>rw){ w=rw; h=w*(YARDS_H/YARDS_W); }
  W=Math.floor(w); H=Math.floor(h);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=Math.round(W*dpr*Z); cv.height=Math.round(H*dpr*Z); ctx.setTransform(dpr*Z,0,0,dpr*Z,0,0);
  const cf=document.getElementById('confetti'); cf.width=Math.round(rect.width*dpr); cf.height=Math.round(rect.height*dpr);
  draw();
}
let side='L';                                  // current field orientation
const mir = x => side==='L' ? x : -x;
function toPx(x,y){ const s=W/YARDS_W; return [W/2 + mir(x)*s, H - (y-view.y0)*s]; }
function setView(v){ if(view!==v){ view=v; sizeCanvas(); } }
const font = (px,w=700) => `${w} ${px}px ${FONT}`;

function drawField(){
  const s=W/YARDS_W, top=view.y0+view.h;
  ctx.clearRect(0,0,W,H);
  for(let y=Math.floor(view.y0/5)*5-5;y<top;y+=5){
    ctx.fillStyle = (Math.round(y/5)%2) ? '#2a8f47' : '#2f9e4f';
    const [,py]=toPx(0,y+5), [,py2]=toPx(0,y); ctx.fillRect(0,Math.max(0,py),W,Math.min(H,py2)-Math.max(0,py));

function pathLength(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return L; }

const SNAP_DUR=0.6; // seconds for the ball to reach the QB; the QB holds still until it arrives
let scene={route:null,progress:0,showLabel:false,tree:false,play:null,focus:null,onlyMine:false,t:0};
/* ---- Play rendering ---- */
function fullPath(r){ return r.motion ? r.motion.concat(r.pts.slice(1)) : r.pts; }
function drawPlay(play, t, focus, onlyMine, reveal){
  const s=W/YARDS_W; const SPEED=7; // yards per second
  const snapT=snapTime(play);
  POS_ORDER.forEach(p=>{
    const r=play.routes[p]; if(!r) return;
    const col=POS[p].color; const mine=focus===p;
    const path=fullPath(r); const L=pathLength(path); const mLen=r.motion?pathLength(r.motion):0;
    let d; if(r.motion){ d=t*SPEED; } else { d=Math.max(0,(t-snapT-(r.delay?0.7:0)-(p==='Q'?SNAP_DUR:0)))*SPEED; }

function posAt(play,p,t,snapT){ const r=play.routes[p]; if(!r) return null; const path=fullPath(r), L=pathLength(path);

  ctx.fillStyle='#8b4a1f'; ctx.strokeStyle='#fff'; ctx.lineWidth=Math.max(1,s*.08);
  ctx.beginPath(); ctx.ellipse(0,0,s*.75,s*.45,0,0,Math.PI*2); ctx.fill(); ctx.stroke();

function snapTime(play){

  } else {
    scene={route:null,progress:0}; draw();
    $('prompt').innerHTML=`<span class="big">Run a ${current.name} (${current.n})</span>${q} · tap the matching route`;
    $('panel').innerHTML=`${levelsHTML()}<div class="answers">${choices.map(r=>`<button class="btn pic" data-n="${r.n}" onclick="answer(${r.n},this)">${miniSVG(r)}</button>`).join('')}</div>`;
  }
}
function answer(n,btn){
  if(answering) return; answering=true;
  const btns=[...document.querySelectorAll('.answers .btn')]; const ok=n===current.n;
  btns.forEach(b=>{ if(+b.dataset.n===current.n) b.classList.add('good'); else if(b===btn) b.classList.add('bad'); else b.classList.add('dim'); });
  if(ok){ stars++; streak++; saveProgress(); roundCorrect++; beep(true); confetti(); showBanner(pick(['Touchdown','Nice cut','Great route','Titan up','First down', player?('Go '+player.name):'Boom'])); }
  else { streak=0; beep(false); showBanner('Almost','#a5acaf'); }
  updateScore();
  if(mode==='pick') animate(current,true); else { scene.showLabel=true; draw(); }
  roundIdx++; setTimeout(nextQuestion, ok?1500:2200);
}
function showBanner(t,color){ const b=$('banner'); const d=b.querySelector('div'); d.textContent=t; d.style.color=color||'#fff'; b.style.display='flex'; clearTimeout(b._t); b._t=setTimeout(()=>b.style.display='none',1100); }
function showMedal(){
  const m=$('medal'); const pct=roundCorrect/round.length; let unlockMsg='';
  const key=mode+level; progress.best[key]=Math.max(progress.best[key]||0, roundCorrect);
  if(roundCorrect>=UNLOCK_SCORE && level===progress.unlocked-1 && progress.unlocked<LEVELS.length){ progress.unlocked++; unlockMsg=`🔓 ${LEVELS[progress.unlocked-1].label} unlocked`; }
  saveProgress();
  $('medalTitle').textContent = (pct===1?'Perfect round':pct>=.7?'Great job':'Keep practicing') + (player?', '+player.name:'');
  $('medalText').textContent = `${roundCorrect} of ${round.length} correct on ${LEVELS[level].label.split(' · ')[1].toLowerCase()}`;
  $('medalUnlock').textContent = unlockMsg || (roundCorrect<UNLOCK_SCORE && level===progress.unlocked-1 && progress.unlocked<LEVELS.length ? `Get ${UNLOCK_SCORE} of 9 to unlock the next level` : '');
  m.querySelector('.trophy').textContent = pct===1?'🏆':pct>=.7?'🥇':'💪';
  m.style.display='flex'; if(pct===1) confetti(120);
}
function hideMedal(silent){ const m=$('medal'); if(m.style.display==='flex'){ m.style.display='none'; if(!silent){ if(section==='plays') startPlayRound(); else startRound(); } } }

/* ---------- Plays tab ---------- */
let playMode='study', playIdx=0, onlyMine=false, pround=[], pIdx=0, pCorrect=0, pCurrent=null;
const myPos=()=>progress.position||null;
function showPlays(){
  if(!myPos()) return showPositionPicker();
  if(mode==='study') showStudy(); else startPlayRound();
}
function playSVG(play){
  const w=36,h=20,y0=-7.5,sc=8; const X=x=>((x+w/2)*sc).toFixed(1), Y=y=>((y0+h-y)*sc).toFixed(1);
  let g='';
  for(let y=-5;y<=10;y+=5) g+=`<line x1="0" y1="${Y(y)}" x2="${w*sc}" y2="${Y(y)}" stroke="${y===0?'#555':'#c5cbd0'}" stroke-width="${y===0?2:1}"/>`;
  POS_ORDER.forEach(p=>{ const r=play.routes[p]; if(!r) return; const col=POS[p].color;
    if(r.motion) g+=`<polyline points="${r.motion.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="none" stroke="${col}" stroke-width="2.5" stroke-dasharray="4 3"/>`;
    if(r.pts.length>1){ const pts=r.pts; g+=`<polyline points="${pts.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>`;
      if(p!=='Q'){ const a=pts[pts.length-2],b=pts[pts.length-1]; const ang=Math.atan2(-(b[1]-a[1]),(b[0]-a[0])); const bx=+X(b[0]),by=+Y(b[1]);
        g+=`<polygon points="${(bx+Math.cos(ang)*8).toFixed(1)},${(by+Math.sin(ang)*8).toFixed(1)} ${(bx+Math.cos(ang+2.5)*7).toFixed(1)},${(by+Math.sin(ang+2.5)*7).toFixed(1)} ${(bx+Math.cos(ang-2.5)*7).toFixed(1)},${(by+Math.sin(ang-2.5)*7).toFixed(1)}" fill="${col}"/>`; } }
    const [sx,sy]=r.motion?r.motion[0]:r.pts[0]; const cx=+X(sx),cy=+Y(sy);
    if(play.star===p){ let pts=[]; for(let i=0;i<10;i++){ const rr=i%2?5:10,a=-Math.PI/2+i*Math.PI/5; pts.push((cx+Math.cos(a)*rr).toFixed(1)+','+(cy+Math.sin(a)*rr).toFixed(1)); } g+=`<polygon points="${pts.join(' ')}" fill="${col}" stroke="#fff" stroke-width="1.5"/>`; }
    else g+=`<circle cx="${cx}" cy="${cy}" r="8" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
    g+=`<text x="${cx}" y="${cy+0.5}" font-family="Oswald,Arial Narrow,sans-serif" font-weight="700" font-size="9" fill="#fff" text-anchor="middle" dominant-baseline="middle">${p}</text>`;
  });
  return `<svg viewBox="0 0 ${w*sc} ${h*sc}" xmlns="http://www.w3.org/2000/svg">${g}</svg>`;
}
function showPlaybook(){
  $('prompt').innerHTML=`<span class="big">Playbook</span>Tap a play to study it`;
  $('panel').innerHTML=`<div class="poschip">${myPos()?`You play ${posBadge(myPos())}`:'No position yet'} <button class="lvl pos" onclick="showPositionPicker()">${myPos()?'Change':'Pick position'}</button></div><div class="bookgrid">${PLAYS.map((p,i)=>`<button class="bookcard" onclick="openPlay(${i})"><div class="hd"><span class="n">${p.num}</span>${p.name}</div>${playSVG(p)}</button>`).join('')}</div>`;
}
function openPlay(i){ playIdx=i; setMode('study'); }
function routeThumb(r,col){
  const pts=r.pts, mo=r.motion||[]; const all=pts.concat(mo);
  const xs=all.map(p=>p[0]), ys=all.map(p=>p[1]);
  const minx=Math.min(...xs)-1.5, maxx=Math.max(...xs)+1.5, miny=Math.min(...ys,-1)-1, maxy=Math.max(...ys)+1.5;
  const S=84, pad=6, sc=Math.min((S-2*pad)/(maxx-minx),(S-2*pad)/(maxy-miny));
  const ox=pad+((S-2*pad)-(maxx-minx)*sc)/2, oy=pad+((S-2*pad)-(maxy-miny)*sc)/2;
  const X=x=>(ox+(x-minx)*sc).toFixed(1), Y=y=>(S-oy-(y-miny)*sc).toFixed(1);
  let g=`<rect width="${S}" height="${S}" rx="8" fill="#2f9e4f"/>`;
  for(let y=Math.ceil(miny/5)*5;y<=maxy;y+=5) g+=`<line x1="0" y1="${Y(y)}" x2="${S}" y2="${Y(y)}" stroke="rgba(255,255,255,${y===0?.9:.45})" stroke-width="${y===0?2:1}"/>`;
  if(mo.length) g+=`<polyline points="${mo.map(([x,y])=>X(x)+','+Y(y)).join(' ')}" fill="none" stroke="#fff" stroke-width="2" stroke-dasharray="3 3"/>`;
  const d=pts.map(([x,y])=>X(x)+','+Y(y)).join(' ');
  g+=`<polyline points="${d}" fill="none" stroke="#0c2340" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".4" transform="translate(1,1)"/>`;
  g+=`<polyline points="${d}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>`;
  if(pts.length>1){ const a=pts[pts.length-2],b=pts[pts.length-1]; const ang=Math.atan2(-(b[1]-a[1]),(b[0]-a[0])); const bx=+X(b[0]),by=+Y(b[1]);
    g+=`<polygon points="${(bx+Math.cos(ang)*7).toFixed(1)},${(by+Math.sin(ang)*7).toFixed(1)} ${(bx+Math.cos(ang+2.4)*6).toFixed(1)},${(by+Math.sin(ang+2.4)*6).toFixed(1)} ${(bx+Math.cos(ang-2.4)*6).toFixed(1)},${(by+Math.sin(ang-2.4)*6).toFixed(1)}" fill="#fff"/>`; }
  const [sx,sy]=mo.length?mo[0]:pts[0]; g+=`<circle cx="${X(sx)}" cy="${Y(sy)}" r="4.5" fill="${col}" stroke="#fff" stroke-width="1.5"/>`;
  return `<svg class="mini" viewBox="0 0 ${S} ${S}">${g}</svg>`;
}
function showPositionPicker(){
  scene={play:PLAYS[0],focus:null,onlyMine:false,t:0}; draw();
  $('prompt').innerHTML=`<span class="big">${player?player.name+', which':'Which'} position are you today?</span>Tap your letter${myPos()?' (last time: '+myPos()+')':''}`;
  $('panel').innerHTML=`<div class="posgrid">${POS_ORDER.map(p=>`<button class="btn ${myPos()===p?'cur':''}" style="background:${POS[p].color};box-shadow:0 6px 0 rgba(0,0,0,.45)" onclick="setPosition('${p}')">${p}</button>`).join('')}</div>`;
}
function setPosition(p){ progress.position=p; saveProgress(); if(mode==='playbook') showPlaybook(); else showPlays(); showBanner('You are '+p, POS[p].color==='#3b4046'?'#fff':POS[p].color); }
function posBadge(p){ return `<span class="posbadge" style="background:${POS[p].color}">${p}</span>`; }
function playChipsHTML(){ return `<div class="poschip">You play ${posBadge(myPos())}<button class="lvl pos" onclick="showPositionPicker()">Change</button></div>`; }
function showStudy(){
  const play=PLAYS[playIdx]; const r=play.routes[myPos()];
  $('prompt').innerHTML=`<span class="big">${play.num} · ${play.name}</span>${myPos()==='Q'?'Quarterback':'You run: <b style="color:#fff">'+(r?r.label:'—')+'</b>'}${play.star===myPos()?' &nbsp;⭐ primary':''}`;
  $('panel').innerHTML=`${playChipsHTML()}<div class="playnav"><button class="btn red" onclick="showStudy()">▶ Run it</button><button class="btn ${onlyMine?'':'ghost'}" onclick="onlyMine=!onlyMine;showStudy()">${onlyMine?'Show everyone':'Just my route'}</button><button class="btn" onclick="stepPlay(-1)">◀ Previous Play</button><button class="btn" onclick="stepPlay(1)">Next Play ▶</button></div><div class="playlist">${PLAYS.map((p,i)=>`<button class="lvl ${i===playIdx?'on':''}" onclick="playIdx=${i};showStudy()">${p.num} ${p.name}</button>`).join('')}</div>`;
  animatePlay(play,myPos(),onlyMine);
}
function stepPlay(d){ playIdx=(playIdx+d+PLAYS.length)%PLAYS.length; showStudy(); }
function startPlayRound(){ pround=shuffle(PLAYS.slice()); pIdx=0; pCorrect=0; nextPlayQ(); }
function nextPlayQ(){
  if(pIdx>=pround.length){ showPlayMedal(); return; }
  if(mode==='mine'&&myPos()==='Q'){ showBanner('QB: try Which play?','#a5acaf'); return setMode('which'); }
  pCurrent=pround[pIdx]; answering=false; const q=`Question ${pIdx+1} of ${pround.length}`;
  if(mode==='which'){
    const choices=shuffle([pCurrent,...shuffle(PLAYS.filter(p=>p!==pCurrent)).slice(0,3)]);
    $('prompt').innerHTML=`<span class="big">Which play is this?</span>${q}`;
    $('panel').innerHTML=`${playChipsHTML()}<div class="answers">${choices.map(p=>`<button class="btn small" data-n="${p.num}" onclick="answerPlay(${p.num},this)">${p.num} · ${p.name}</button>`).join('')}</div>`;
    animatePlay(pCurrent,myPos(),false);
  } else {
    const r=pCurrent.routes[myPos()]; if(!r||!r.label){ pIdx++; return nextPlayQ(); }
    // distractors: this position's routes from other plays (distinct names), then other positions' routes
    const seen=new Set([r.label]); let pool=[];
    PLAYS.filter(p=>p!==pCurrent).forEach(p=>{ const o=p.routes[myPos()]; if(o&&o.label&&!seen.has(o.label)){ seen.add(o.label); pool.push(o); } });
    if(pool.length<3) PLAYS.forEach(p=>POS_ORDER.forEach(q=>{ const o=p.routes[q]; if(q!=='Q'&&o&&o.label&&!seen.has(o.label)){ seen.add(o.label); pool.push(o); } }));
    const opts=shuffle([r,...shuffle(pool).slice(0,3)]); const correctIdx=opts.indexOf(r);
    if(playAnim) cancelAnimationFrame(playAnim); scene={play:pCurrent,focus:myPos(),onlyMine:false,t:0}; draw();
    $('prompt').innerHTML=`<span class="big">${pCurrent.num} · ${pCurrent.name}</span>${q} · tap the route you run as ${myPos()}`;
    $('panel').innerHTML=`${playChipsHTML()}<div class="answers">${opts.map((o,i)=>`<button class="btn pic" data-n="${i}" onclick="answerMine(${i},${correctIdx},this)">${routeThumb(o,POS[myPos()].color)}</button>`).join('')}</div>`;
  }
}
function gradeButtons(correctN,btn,attr='n'){ [...document.querySelectorAll('.answers .btn')].forEach(b=>{ if(b.dataset[attr]==String(correctN)) b.classList.add('good'); else if(b===btn) b.classList.add('bad'); else b.classList.add('dim'); }); }
function answerPlay(n,btn){ if(answering) return; answering=true; const ok=n===pCurrent.num; if(ok) pCorrect++; gradeButtons(pCurrent.num,btn); score(ok); pIdx++; setTimeout(nextPlayQ, ok?1500:2200); }
function answerMine(i,correct,btn){ if(answering) return; answering=true; const ok=i===correct; if(ok) pCorrect++; gradeButtons(correct,btn); score(ok); animatePlay(pCurrent,myPos(),true); pIdx++; setTimeout(nextPlayQ, playDuration(pCurrent)*1000+(ok?600:1200)); }
function score(ok){
  if(ok){ stars++; streak++; saveProgress(); beep(true); confetti(); showBanner(pick(['Touchdown','Nice cut','Great route','Titan up','First down', player?('Go '+player.name):'Boom'])); }
  else { streak=0; beep(false); showBanner('Almost','#a5acaf'); }
  updateScore();
}
function showPlayMedal(){
  const m=$('medal'); const pct=pCorrect/pround.length;
  $('medalTitle').textContent=(pct===1?'Perfect round':pct>=.7?'Great job':'Keep practicing')+(player?', '+player.name:'');
  $('medalText').textContent=`${pCorrect} of ${pround.length} correct`; $('medalUnlock').textContent='';
  m.querySelector('.trophy').textContent=pct===1?'🏆':pct>=.7?'🥇':'💪'; m.style.display='flex'; if(pct===1) confetti(120);
}

/* ---------- Sound ---------- */
let ac=null;
function beep(good){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const notes=good?[523,659,784]:[330,262]; notes.forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.001,ac.currentTime+i*.09); g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.09+.25);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime+i*.09); o.stop(ac.currentTime+i*.09+.3); }); }catch(e){}
}
/* ---------- Confetti ---------- */
function confetti(count=60){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('confetti'), x=c.getContext('2d'); const w=c.width, h=c.height;
  const parts=Array.from({length:count},()=>({x:w/2+(Math.random()-.5)*w*.3, y:h*.45, vx:(Math.random()-.5)*18*dpr, vy:(-10-Math.random()*12)*dpr, r:(4+Math.random()*6)*dpr,
    col:pick(['#4b92db','#c8102e','#a5acaf','#ffffff','#0c2340']), rot:Math.random()*6, vr:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,w,h); parts.forEach(p=>{ p.vy+=.5*dpr; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle=p.col; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); x.restore(); });
    if(t-t0<1600) requestAnimationFrame(f); else x.clearRect(0,0,w,h); })(t0);
}

window.addEventListener('resize', ()=>{ fitApp(); sizeCanvas(); });
window.addEventListener('orientationchange', ()=>setTimeout(()=>{ fitApp(); sizeCanvas(); },250));
new ResizeObserver(()=>sizeCanvas()).observe(fw);
document.fonts && document.fonts.ready.then(draw);
fitApp(); buildRoster(); renderNav(); showTree(); sizeCanvas(); updateScore();
</script>
