<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0c2340">
<title>Titans Route Tree Trainer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --navy:#0c2340; --navy2:#071a30; --tblue:#4b92db; --tblue-dark:#2f6fb5;
    --red:#c8102e; --red-dark:#8e0a20; --silver:#a5acaf; --silver-dark:#6f7578; --white:#ffffff;
    --grass:#2f9e4f; --grass2:#2a8f47; --good:#2fbf71; --good-dark:#1d8a4f;
    --safe-top:env(safe-area-inset-top,0px); --safe-bot:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
  html,body{margin:0;height:100%;background:var(--navy);overflow:hidden}
  body{font-family:"Oswald","Arial Narrow",Impact,system-ui,sans-serif;color:var(--white);
       display:flex;flex-direction:column;height:100dvh;padding-top:var(--safe-top);padding-bottom:var(--safe-bot);
       background:linear-gradient(180deg,#123059 0%,#0c2340 45%,#071a30 100%)}
  header{display:flex;align-items:center;justify-content:space-between;padding:10px 14px 6px;gap:10px}
  .brand{display:flex;align-items:center;gap:10px;min-width:0}
  .brand img{height:44px;width:auto;display:none}
  .brand img.loaded{display:block}
  .brand .t{line-height:1}
  .brand .t b{display:block;font-size:22px;font-weight:700;letter-spacing:1px;text-transform:uppercase}
  .brand .t span{display:block;font-size:12px;color:var(--tblue);letter-spacing:2px;text-transform:uppercase}
  .scorebox{display:flex;gap:8px;align-items:center;flex-shrink:0}
  .pill{background:rgba(255,255,255,.08);border:2px solid rgba(165,172,175,.45);border-radius:999px;padding:3px 12px;font-size:16px;font-weight:700;white-space:nowrap}
  .pill.red{background:var(--red);border-color:var(--red-dark)}
  .pill.player{appearance:none;font:inherit;color:#fff;background:var(--tblue);border-color:var(--tblue-dark);cursor:pointer;max-width:120px;overflow:hidden;text-overflow:ellipsis}
  main{flex:1;display:flex;flex-direction:column;min-height:0;padding:0 12px}
  .fieldwrap{position:relative;flex:1;min-height:0;display:flex;align-items:center;justify-content:center}
  #field{border-radius:18px;box-shadow:0 8px 0 var(--navy2),0 12px 30px rgba(0,0,0,.5);background:var(--grass);max-width:100%;max-height:100%;touch-action:manipulation}
  .confetti{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
  .prompt{text-align:center;font-size:17px;min-height:24px;margin:8px 0 4px;color:var(--silver);line-height:1.2}
  .prompt .big{display:block;font-size:30px;color:var(--white);line-height:1.05;letter-spacing:.5px;text-transform:uppercase}
  .levels{display:flex;gap:6px;justify-content:center;margin:4px 0 6px}
  .lvl{appearance:none;border:2px solid rgba(165,172,175,.4);background:rgba(255,255,255,.06);color:var(--silver);border-radius:999px;padding:5px 12px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.5px}
  .lvl.on{background:var(--tblue);border-color:var(--tblue-dark);color:#fff}
  .lvl.locked{opacity:.5}
  .answers{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:2px 0 10px}
  .btn{appearance:none;border:0;border-radius:14px;padding:15px 8px;font:inherit;font-size:24px;font-weight:700;letter-spacing:.5px;color:#fff;
       background:var(--tblue);box-shadow:0 6px 0 var(--tblue-dark);cursor:pointer;transition:transform .08s;line-height:1.05}
  .btn:active{transform:translateY(4px);box-shadow:0 2px 0 var(--tblue-dark)}
  .btn.red{background:var(--red);box-shadow:0 6px 0 var(--red-dark)}
  .btn.good{background:var(--good);box-shadow:0 6px 0 var(--good-dark)}
  .btn.bad{background:var(--red);box-shadow:0 6px 0 var(--red-dark)}
  .btn.dim{opacity:.4}
  .btn .mini{display:block;width:100%;height:78px}
  .btn.pic{padding:8px}
  nav{display:flex;gap:6px;padding:8px 12px 10px;background:rgba(0,0,0,.35);border-top:3px solid var(--red)}
  nav button{flex:1;appearance:none;border:2px solid rgba(165,172,175,.3);border-radius:12px;padding:8px 2px;font:inherit;font-size:14px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;
             background:rgba(255,255,255,.06);color:var(--silver)}
  nav button.on{background:var(--tblue);color:#fff;border-color:var(--tblue-dark);box-shadow:0 4px 0 var(--tblue-dark)}
  nav button span{display:block;font-size:20px}
  .learnlist{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 0 10px}
  .learnlist .btn{padding:10px 4px;font-size:18px;background:rgba(255,255,255,.1);box-shadow:0 5px 0 rgba(0,0,0,.35);border:2px solid rgba(165,172,175,.35)}
  .learnlist .btn .num{display:block;font-size:26px;color:var(--tblue);line-height:1}
  .learnlist .btn.on{background:var(--red);border-color:var(--red-dark);box-shadow:0 5px 0 var(--red-dark)}
  .learnlist .btn.on .num{color:#fff}
  .sidetoggle{display:flex;justify-content:center;gap:6px;padding:4px 0 10px}
  .banner{position:absolute;inset:0;display:none;align-items:center;justify-content:center;pointer-events:none;z-index:5}
  .banner div{font-size:60px;font-weight:700;color:#fff;text-transform:uppercase;letter-spacing:2px;text-shadow:0 5px 0 var(--navy2),0 8px 20px rgba(0,0,0,.5);transform:rotate(-5deg);animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
  @keyframes pop{from{transform:scale(.2) rotate(-5deg);opacity:0}to{transform:scale(1) rotate(-5deg);opacity:1}}
  .medal{position:absolute;inset:0;background:rgba(12,35,64,.94);display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;z-index:10;border-radius:18px;padding:20px}
  .medal .trophy{font-size:90px}
  .medal h2{margin:6px 0;font-size:32px;text-transform:uppercase;letter-spacing:1px}
  .medal p{margin:2px 0 14px;font-size:18px;color:var(--silver)}
  .medal .unlock{color:var(--tblue);font-size:20px;margin-bottom:12px}

  .screen{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:24px;
    background:
      radial-gradient(ellipse 120% 60% at 50% -10%, rgba(75,146,219,.55), transparent 60%),
      radial-gradient(ellipse 80% 50% at 50% 110%, rgba(200,16,46,.35), transparent 60%),
      repeating-linear-gradient(0deg, rgba(255,255,255,.035) 0 2px, transparent 2px 28px),
      linear-gradient(180deg,#143664 0%,#0c2340 50%,#050f1f 100%)}
  .screen::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:.5;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.9' numOctaves='3' stitchTiles='stitch'/><feColorMatrix values='0 0 0 0 .5 0 0 0 0 .5 0 0 0 0 .5 0 0 0 .6 0'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>")}
  .screen::after{content:"";position:absolute;left:8%;right:8%;bottom:0;height:3px;background:var(--red);box-shadow:0 0 30px 6px rgba(200,16,46,.5)}
  .screen > *{position:relative;z-index:1}
  .splash img{display:block;margin:0 auto;width:min(78vw,520px);filter:drop-shadow(0 18px 30px rgba(0,0,0,.6)) drop-shadow(0 0 40px rgba(75,146,219,.35))}
  .splash h1{margin:18px 0 4px;font-size:clamp(34px,9vw,64px);line-height:1;text-transform:uppercase;letter-spacing:2px;text-shadow:0 4px 0 var(--navy2),0 10px 30px rgba(0,0,0,.6)}
  .splash h1 small{display:block;font-size:.45em;color:var(--tblue);letter-spacing:5px;font-weight:500}
  .splash p{color:var(--silver);font-size:18px;margin:14px 0 26px;letter-spacing:1px}
  .splash .btn{font-size:26px;padding:16px 44px;letter-spacing:2px;text-transform:uppercase}
  .picker{justify-content:flex-start;padding-top:max(34px,var(--safe-top));overflow:auto}
  .picker img{height:70px;margin-bottom:6px}
  .picker h2{margin:6px 0 2px;font-size:36px;text-transform:uppercase;letter-spacing:2px}
  .picker p{margin:0 0 18px;color:var(--silver);font-size:17px}
  .roster{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:min(92vw,520px)}
  .roster .btn{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;font-size:24px;background:rgba(255,255,255,.08);border:2px solid rgba(165,172,175,.35);box-shadow:0 6px 0 rgba(0,0,0,.4)}
  .roster .btn:active{box-shadow:0 2px 0 rgba(0,0,0,.4)}
  .roster .jersey{width:48px;height:48px;border-radius:12px;display:grid;place-items:center;font-size:22px;font-weight:700;background:var(--navy2);border:3px solid var(--tblue);color:#fff;flex-shrink:0}
  .roster .btn small{display:block;font-size:13px;color:var(--silver);font-weight:500;letter-spacing:.5px}
  .picker .cancel{margin-top:18px;background:transparent;border:2px solid rgba(165,172,175,.35);color:var(--silver);border-radius:999px;padding:8px 18px;font:inherit;font-size:15px}
  @media (prefers-reduced-motion:reduce){.banner div{animation:none}}
</style>
</head>

<script>
/* =====================================================================
   PLAYBOOK DATA
   Everything the game knows about the team lives here. To add plays later,
   add a "plays" array (each play = a list of receivers with a route number
   and alignment) and the game can grow a "Plays" tab without touching the
   drawing or quiz code.
   Coordinates are in yards from the receiver's start: x negative = toward
   the sideline, y = upfield. The game mirrors x for a right-side receiver.
   ===================================================================== */
const PLAYBOOK = {
  team: "Titans",
  routes: [
    {n:1, name:"Flat",     pts:[[0,0],[0,2],[-11,2]],   tip:"Two steps up, then turn and race to the sideline."},
    {n:2, name:"Slant",    pts:[[0,0],[0,2],[9,11]],    tip:"Two steps up, then cut across the middle at an angle."},
    {n:3, name:"Comeback", pts:[[0,0],[0,10],[-5,5]],   tip:"Ten yards up, stop, and come back toward the sideline."},
    {n:4, name:"Curl",     pts:[[0,0],[0,10],[5,5]],    tip:"Ten yards up, stop, and curl back toward the middle."},
    {n:5, name:"Out",      pts:[[0,0],[0,10],[-11,10]], tip:"Ten yards up, then a sharp turn to the sideline."},
    {n:6, name:"Dig",      pts:[[0,0],[0,10],[11,10]],  tip:"Ten yards up, then a sharp turn across the middle."},
    {n:7, name:"Corner",   pts:[[0,0],[0,10],[-9,19]],  tip:"Ten yards up, then angle deep toward the corner."},
    {n:8, name:"Post",     pts:[[0,0],[0,10],[9,19]],   tip:"Ten yards up, then angle deep toward the goal post."},
    {n:9, name:"Fade",     pts:[[0,0],[0,21]],          tip:"Straight up the field, full speed."},
  ],
  roster: [
    {name:"Amelia",  num:1},
    {name:"Ava",     num:2},
    {name:"Dakota",  num:3},
    {name:"Emerson", num:4},
    {name:"Lennon",  num:5},
    {name:"Lillian", num:6},
    {name:"Molly",   num:7},
    {name:"Rhea",    num:8},
  ],
  plays: []
};
const ROUTES = PLAYBOOK.routes;
const byNum = n => ROUTES.find(r=>r.n===n);
document.getElementById('teamName').textContent = PLAYBOOK.team;

/* Levels: which side of the field the receiver lines up on */
const LEVELS = [
  {id:'L', label:'Level 1 · Left side',  sides:['L']},
  {id:'R', label:'Level 2 · Right side', sides:['R']},
  {id:'B', label:'Level 3 · Both sides', sides:['L','R']},
];
const UNLOCK_SCORE = 7; // correct out of 9 needed to unlock the next level
let player=null;
let progress = {unlocked:1, best:{}, stars:0};
const pkey = ()=>'titans-route-'+(player?player.name:'guest');
function loadProgress(){ progress={unlocked:1,best:{},stars:0}; try{ const p=JSON.parse(localStorage.getItem(pkey())); if(p&&p.unlocked) progress=p; }catch(e){} }
function saveProgress(){ progress.stars=stars; try{ localStorage.setItem(pkey(), JSON.stringify(progress)); }catch(e){} }
function buildRoster(){ document.getElementById('roster').innerHTML = PLAYBOOK.roster.map(r=>
  `<button class="btn" onclick="choosePlayer('${r.name}')"><span class="jersey">${r.num}</span><span>${r.name}</span></button>`).join(''); }
function showPicker(){ document.getElementById('picker').style.display='flex'; document.getElementById('splash').style.display='none'; document.getElementById('pickerCancel').style.display = player?'block':'none'; }
function hidePicker(){ document.getElementById('picker').style.display='none'; }
function choosePlayer(name){
  player=PLAYBOOK.roster.find(r=>r.name===name); loadProgress(); stars=progress.stars||0; streak=0; level=0; updateScore();
  document.getElementById('playerChip').textContent='👤 '+player.name;
  hidePicker(); setMode('tree'); showBanner("Let's go, "+player.name);
  try{ localStorage.setItem('titans-route-lastplayer', name); }catch(e){}
}

/* ---------- Field ---------- */
const FONT = '"Oswald","Arial Narrow",Impact,sans-serif';
const cv = document.getElementById('field'), ctx = cv.getContext('2d');
const fw = document.querySelector('.fieldwrap');
let W=300,H=400, dpr=window.devicePixelRatio||1;
const YARDS_W=30, YARDS_H=24;
function sizeCanvas(){
  const rect = fw.getBoundingClientRect(); if(rect.height<40) return;
  let h = rect.height, w = h*(YARDS_W/YARDS_H);
  if (w>rect.width){ w=rect.width; h=w*(YARDS_H/YARDS_W); }
  W=Math.floor(w); H=Math.floor(h);
  cv.style.width=W+'px'; cv.style.height=H+'px';
  cv.width=W*dpr; cv.height=H*dpr; ctx.setTransform(dpr,0,0,dpr,0,0);
  const cf=document.getElementById('confetti'); cf.width=rect.width*dpr; cf.height=rect.height*dpr;
  draw();
}
let side='L';                                  // current field orientation
const mir = x => side==='L' ? x : -x;
function toPx(x,y){ const s=W/YARDS_W; return [W/2 + mir(x)*s, H - 2.5*s - y*s]; }
const font = (px,w=700) => `${w} ${px}px ${FONT}`;

function drawField(){
  const s=W/YARDS_W;
  ctx.clearRect(0,0,W,H);
  for(let y=-3;y<YARDS_H;y+=5){
    ctx.fillStyle = ((y+3)/5)%2 ? '#2a8f47' : '#2f9e4f';
    const [,py]=toPx(0,y+5), [,py2]=toPx(0,y); ctx.fillRect(0,py,W,py2-py);
  }
  const [,ez]=toPx(0,20);
  ctx.fillStyle='#0c2340'; ctx.fillRect(0,0,W,ez);
  ctx.strokeStyle='rgba(255,255,255,.85)'; ctx.lineWidth=Math.max(2,s*.12);
  for(let y=0;y<=20;y+=5){ const [,py]=toPx(0,y); ctx.beginPath(); ctx.moveTo(0,py); ctx.lineTo(W,py); ctx.stroke();
    if(y>0&&y<20){ ctx.fillStyle='rgba(255,255,255,.5)'; ctx.font=font(s*1.2); ctx.textAlign='center'; ctx.fillText(String(y), W*.5, py-s*.8); } }
  ctx.strokeStyle='rgba(255,255,255,.45)';
  for(let y=1;y<20;y++){ if(y%5===0) continue; const [,py]=toPx(0,y);
    [W*.25, W*.75].forEach(px=>{ ctx.beginPath(); ctx.moveTo(px-s*.3,py); ctx.lineTo(px+s*.3,py); ctx.stroke(); }); }
  // sideline / middle labels, swap with side
  ctx.fillStyle='#ffd23f'; ctx.font=font(s*1.1);
  const left = side==='L' ? 'SIDELINE' : 'MIDDLE', right = side==='L' ? 'MIDDLE' : 'SIDELINE';
  ctx.save(); ctx.translate(s*.8, H*.55); ctx.rotate(-Math.PI/2); ctx.textAlign='center'; ctx.fillText(left,0,0); ctx.restore();
  ctx.save(); ctx.translate(W-s*.8, H*.55); ctx.rotate(Math.PI/2); ctx.textAlign='center'; ctx.fillText(right,0,0); ctx.restore();
  const [x0,y0]=toPx(0,0);
  ctx.fillStyle='#fff'; ctx.font=font(s*2); ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('X', x0, y0+s*1.2);
}
function pathLength(pts){ let L=0; for(let i=1;i<pts.length;i++) L+=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]); return L; }
function pointAt(pts,t){ const L=pathLength(pts); let d=t*L;
  for(let i=1;i<pts.length;i++){ const seg=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    if(d<=seg){ const k=d/seg; return [pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k]; } d-=seg; }
  return pts[pts.length-1]; }
function strokePath(pts,prog,off){ const L=pathLength(pts); let d=prog*L; ctx.beginPath();
  let [x,y]=toPx(pts[0][0],pts[0][1]); ctx.moveTo(x+off,y+off);
  for(let i=1;i<pts.length;i++){ const seg=Math.hypot(pts[i][0]-pts[i-1][0], pts[i][1]-pts[i-1][1]);
    if(d>=seg){ [x,y]=toPx(pts[i][0],pts[i][1]); ctx.lineTo(x+off,y+off); d-=seg; }
    else{ const k=d/seg; [x,y]=toPx(pts[i-1][0]+(pts[i][0]-pts[i-1][0])*k, pts[i-1][1]+(pts[i][1]-pts[i-1][1])*k); ctx.lineTo(x+off,y+off); break; } }
  ctx.stroke(); }
function arrowHead(pts,color,size){ const a=pts[pts.length-2], b=pts[pts.length-1];
  const [ax,ay]=toPx(a[0],a[1]), [bx,by]=toPx(b[0],b[1]); const ang=Math.atan2(by-ay,bx-ax);
  ctx.fillStyle=color; ctx.beginPath(); ctx.moveTo(bx+Math.cos(ang)*size, by+Math.sin(ang)*size);
  ctx.lineTo(bx+Math.cos(ang+2.5)*size*.9, by+Math.sin(ang+2.5)*size*.9); ctx.lineTo(bx+Math.cos(ang-2.5)*size*.9, by+Math.sin(ang-2.5)*size*.9); ctx.closePath(); ctx.fill(); }
function drawRoute(r,prog,color='#4b92db',width=.45,runner=true){
  const s=W/YARDS_W; ctx.lineCap='round'; ctx.lineJoin='round';
  ctx.strokeStyle='rgba(0,0,0,.35)'; ctx.lineWidth=s*width*1.5; strokePath(r.pts,prog,s*.12);
  ctx.strokeStyle=color; ctx.lineWidth=s*width; strokePath(r.pts,prog,0);
  if(prog>=1) arrowHead(r.pts,color,s*1.1);
  if(runner){ const [px,py]=pointAt(r.pts,Math.min(prog,1)); const [rx,ry]=toPx(px,py);
    ctx.font=`${s*2.2}px system-ui`; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🏃‍♀️', rx, ry-s*.4); }
}
function label(txt,x,y,fs,fill='#fff',bg='rgba(12,35,64,.9)'){
  const s=W/YARDS_W; ctx.font=font(fs); const tw=ctx.measureText(txt).width; const pad=fs*.45, h=fs*1.45;
  x=Math.min(Math.max(x,tw/2+pad+2), W-tw/2-pad-2); y=Math.min(Math.max(y,h/2+2),H-h/2-2);
  ctx.fillStyle=bg; roundRect(x-tw/2-pad,y-h/2,tw+pad*2,h,h/2); ctx.fill();
  ctx.fillStyle=fill; ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText(txt,x,y);
}
function roundRect(x,y,w,h,r){ ctx.beginPath(); ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r); ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath(); }

let scene={route:null,progress:0,showLabel:false,tree:false};
function draw(){
  drawField(); const s=W/YARDS_W;
  if(scene.tree){
    ROUTES.forEach(r=>drawRoute(r,1,'#ffffff',.3,false));
    // fixed label anchors in yards, chosen so no label sits on a route line or another label
    const spots={1:[-8,0.7],2:[11,13.4],3:[-9,3.6],4:[9,3.6],5:[-12.6,10],6:[12.6,10],7:[-10.5,20.7],8:[10.5,20.7],9:[0,20.7]};
    ROUTES.forEach(r=>{ const [lx,ly]=toPx(spots[r.n][0],spots[r.n][1]);
      label(`${r.n} ${r.name}`, lx, ly, s*.95, '#fff', r.n%2? 'rgba(200,16,46,.92)':'rgba(75,146,219,.95)'); });
    return;
  }
  if(scene.route){ drawRoute(scene.route,scene.progress);
    if(scene.showLabel){ const e=scene.route.pts[scene.route.pts.length-1]; let [lx,ly]=toPx(e[0],e[1]); label(`${scene.route.name} (${scene.route.n})`, lx, ly-s*2.8, s*1.4); } }
}
let animId=null;
function animate(route,showLabel,done){
  if(animId) cancelAnimationFrame(animId);
  scene={route,progress:0,showLabel:false,tree:false};
  const dur=1400, t0=performance.now(), reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  function step(t){ const k=reduce?1:Math.min(1,(t-t0)/dur); scene.progress=k; draw();
    if(k<1) animId=requestAnimationFrame(step); else { scene.showLabel=showLabel; draw(); done&&done(); } }
  animId=requestAnimationFrame(step);
}

/* ---------- Mini thumbnails for Pick it ---------- */
function miniSVG(r){
  const sc=3.2, ox=42, oy=76; const pts=r.pts.map(([x,y])=>[ox+mir(x)*sc, oy-y*sc]);
  const d=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const a=pts[pts.length-2], b=pts[pts.length-1]; const ang=Math.atan2(b[1]-a[1], b[0]-a[0]);
  const tri=[[b[0]+Math.cos(ang)*7,b[1]+Math.sin(ang)*7],[b[0]+Math.cos(ang+2.4)*6,b[1]+Math.sin(ang+2.4)*6],[b[0]+Math.cos(ang-2.4)*6,b[1]+Math.sin(ang-2.4)*6]];
  const sl = side==='L' ? 'x1="2" y1="10" x2="2" y2="82"' : 'x1="82" y1="10" x2="82" y2="82"';
  return `<svg class="mini" viewBox="0 0 84 84"><rect width="84" height="84" rx="8" fill="#2f9e4f"/>
   <g stroke="rgba(255,255,255,.5)" stroke-width="1"><line x1="0" y1="${oy-5*sc}" x2="84" y2="${oy-5*sc}"/><line x1="0" y1="${oy-10*sc}" x2="84" y2="${oy-10*sc}"/><line x1="0" y1="${oy-15*sc}" x2="84" y2="${oy-15*sc}"/></g>
   <line ${sl} stroke="#fff" stroke-width="3"/>
   <path d="${d}" fill="none" stroke="#0c2340" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity=".4" transform="translate(1,1)"/>
   <path d="${d}" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
   <polygon points="${tri.map(p=>p.map(v=>v.toFixed(1)).join(',')).join(' ')}" fill="#fff"/>
   <circle cx="${ox}" cy="${oy}" r="3.5" fill="#4b92db"/></svg>`;
}

/* ---------- Game state ---------- */
let mode='tree', level=0, stars=0, streak=0, round=[], roundIdx=0, roundCorrect=0, answering=false, current=null;
const $=id=>document.getElementById(id);
function updateScore(){ $('stars').textContent='⭐ '+stars; $('streak').textContent='🔥 '+streak; }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const pick=a=>a[Math.floor(Math.random()*a.length)];

function setMode(m){
  mode=m; ['tree','learn','name','number','pick'].forEach(k=>$('tab-'+k).classList.toggle('on',k===m));
  hideMedal(true); if(animId) cancelAnimationFrame(animId);
  if(m==='tree') showTree(); else if(m==='learn') showLearn(); else startRound();
}
function sideToggleHTML(){
  return `<div class="sidetoggle"><button class="lvl ${side==='L'?'on':''}" onclick="setSide('L')">Left side receiver</button><button class="lvl ${side==='R'?'on':''}" onclick="setSide('R')">Right side receiver</button></div>`;
}
function setSide(s){ side=s; if(mode==='tree') showTree(); else if(mode==='learn') showLearn(scene.route); }

/* Tree */
function showTree(){
  scene={route:null,progress:0,tree:true}; draw();
  $('prompt').innerHTML=`<span class="big">The route tree</span>Odd numbers break to the sideline, even numbers break to the middle`;
  $('panel').innerHTML=sideToggleHTML();
}
/* Learn */
function showLearn(sel){
  scene={route:sel||null,progress:sel?1:0,showLabel:!!sel}; draw();
  $('prompt').innerHTML = sel ? `<span class="big">${sel.name} (${sel.n})</span>${sel.tip}` : `<span class="big">Learn the routes</span>Tap a route to watch it run`;
  $('panel').innerHTML = `<div class="learnlist">${ROUTES.map(r=>`<button class="btn ${sel&&sel.n===r.n?'on':''}" onclick="learnRoute(${r.n})"><span class="num">${r.n}</span>${r.name}</button>`).join('')}</div>${sideToggleHTML()}`;
}
function learnRoute(n){ const r=byNum(n); showLearn(r); animate(r,true); }

/* Quizzes with levels */
function levelsHTML(){
  return `<div class="levels">${LEVELS.map((l,i)=>`<button class="lvl ${i===level?'on':''} ${i>=progress.unlocked?'locked':''}" onclick="setLevel(${i})">${i>=progress.unlocked?'🔒 ':''}${l.label}</button>`).join('')}</div>`;
}
function setLevel(i){ if(i>=progress.unlocked){ showBanner('Locked','#a5acaf'); return; } level=i; startRound(); }
function startRound(){ round=shuffle(ROUTES.slice()); roundIdx=0; roundCorrect=0; nextQuestion(); }
function nextQuestion(){
  if(roundIdx>=round.length){ showMedal(); return; }
  current=round[roundIdx]; answering=false; side=pick(LEVELS[level].sides);
  const choices=shuffle([current,...shuffle(ROUTES.filter(r=>r.n!==current.n)).slice(0,3)]);
  const q=`Question ${roundIdx+1} of ${round.length}`;
  if(mode==='name'){
    $('prompt').innerHTML=`<span class="big">Which route is this?</span>${q}`;
    $('panel').innerHTML=`${levelsHTML()}<div class="answers">${choices.map(r=>`<button class="btn" data-n="${r.n}" onclick="answer(${r.n},this)">${r.name}</button>`).join('')}</div>`;
    animate(current,false);
  } else if(mode==='number'){
    $('prompt').innerHTML=`<span class="big">What number is this route?</span>${q}`;
    $('panel').innerHTML=`${levelsHTML()}<div class="answers">${choices.map(r=>`<button class="btn" data-n="${r.n}" onclick="answer(${r.n},this)">${r.n}</button>`).join('')}</div>`;
    animate(current,false);
  } else {
    scene={route:null,progress:0}; draw();
    $('prompt').innerHTML=`<span class="big">Run a ${current.name} (${current.n})</span>${q} · tap the matching route`;
    $('panel').innerHTML=`${levelsHTML()}<div class="answers">${choices.map(r=>`<button class="btn pic" data-n="${r.n}" onclick="answer(${r.n},this)">${miniSVG(r)}</button>`).join('')}</div>`;
  }
}
function answer(n,btn){
  if(answering) return; answering=true;
  const btns=[...document.querySelectorAll('.answers .btn')]; const ok=n===current.n;
  btns.forEach(b=>{ if(+b.dataset.n===current.n) b.classList.add('good'); else if(b===btn) b.classList.add('bad'); else b.classList.add('dim'); });
  if(ok){ stars++; streak++; saveProgress(); roundCorrect++; beep(true); confetti(); showBanner(pick(['Touchdown','Nice cut','Great route','Titan up','First down', player?('Go '+player.name):'Boom'])); }
  else { streak=0; beep(false); showBanner('Almost','#a5acaf'); }
  updateScore();
  if(mode==='pick') animate(current,true); else { scene.showLabel=true; draw(); }
  roundIdx++; setTimeout(nextQuestion, ok?1500:2200);
}
function showBanner(t,color){ const b=$('banner'); const d=b.querySelector('div'); d.textContent=t; d.style.color=color||'#fff'; b.style.display='flex'; clearTimeout(b._t); b._t=setTimeout(()=>b.style.display='none',1100); }
function showMedal(){
  const m=$('medal'); const pct=roundCorrect/round.length; let unlockMsg='';
  const key=mode+level; progress.best[key]=Math.max(progress.best[key]||0, roundCorrect);
  if(roundCorrect>=UNLOCK_SCORE && level===progress.unlocked-1 && progress.unlocked<LEVELS.length){ progress.unlocked++; unlockMsg=`🔓 ${LEVELS[progress.unlocked-1].label} unlocked`; }
  saveProgress();
  $('medalTitle').textContent = (pct===1?'Perfect round':pct>=.7?'Great job':'Keep practicing') + (player?', '+player.name:'');
  $('medalText').textContent = `${roundCorrect} of ${round.length} correct on ${LEVELS[level].label.split(' · ')[1].toLowerCase()}`;
  $('medalUnlock').textContent = unlockMsg || (roundCorrect<UNLOCK_SCORE && level===progress.unlocked-1 && progress.unlocked<LEVELS.length ? `Get ${UNLOCK_SCORE} of 9 to unlock the next level` : '');
  m.querySelector('.trophy').textContent = pct===1?'🏆':pct>=.7?'🥇':'💪';
  m.style.display='flex'; if(pct===1) confetti(120);
}
function hideMedal(silent){ const m=$('medal'); if(m.style.display==='flex'){ m.style.display='none'; if(!silent) startRound(); } }

/* ---------- Sound ---------- */
let ac=null;
function beep(good){
  try{ ac=ac||new (window.AudioContext||window.webkitAudioContext)(); if(ac.state==='suspended') ac.resume();
    const notes=good?[523,659,784]:[330,262]; notes.forEach((f,i)=>{ const o=ac.createOscillator(), g=ac.createGain(); o.type='triangle'; o.frequency.value=f;
      g.gain.setValueAtTime(0.001,ac.currentTime+i*.09); g.gain.exponentialRampToValueAtTime(.25,ac.currentTime+i*.09+.02); g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+i*.09+.25);
      o.connect(g).connect(ac.destination); o.start(ac.currentTime+i*.09); o.stop(ac.currentTime+i*.09+.3); }); }catch(e){}
}
/* ---------- Confetti ---------- */
function confetti(count=60){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  const c=$('confetti'), x=c.getContext('2d'); const w=c.width, h=c.height;
  const parts=Array.from({length:count},()=>({x:w/2+(Math.random()-.5)*w*.3, y:h*.45, vx:(Math.random()-.5)*18*dpr, vy:(-10-Math.random()*12)*dpr, r:(4+Math.random()*6)*dpr,
    col:pick(['#4b92db','#c8102e','#a5acaf','#ffffff','#0c2340']), rot:Math.random()*6, vr:(Math.random()-.5)*.3}));
  const t0=performance.now();
  (function f(t){ x.clearRect(0,0,w,h); parts.forEach(p=>{ p.vy+=.5*dpr; p.x+=p.vx; p.y+=p.vy; p.rot+=p.vr; x.save(); x.translate(p.x,p.y); x.rotate(p.rot); x.fillStyle=p.col; x.fillRect(-p.r/2,-p.r/2,p.r,p.r*.6); x.restore(); });
    if(t-t0<1600) requestAnimationFrame(f); else x.clearRect(0,0,w,h); })(t0);
}

window.addEventListener('resize', sizeCanvas);
window.addEventListener('orientationchange', ()=>setTimeout(sizeCanvas,200));
new ResizeObserver(()=>sizeCanvas()).observe(fw);
document.fonts && document.fonts.ready.then(draw);
buildRoster(); showTree(); sizeCanvas(); updateScore();
</script>
</body>
</html>
